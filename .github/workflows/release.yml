name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -o dist/dependabot-tool ./

      - name: Archive
        run: |
          archive="dependabot-tool_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -C dist -czf "$archive" dependabot-tool
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dependabot-tool_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ARCHIVE }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n1 || true)
          RANGE="${PREV_TAG:+$PREV_TAG..}$TAG"

          declare -A TITLES=(
            [feat]="Features"
            [fix]="Fixes"
            [perf]="Performance"
            [refactor]="Refactoring"
            [docs]="Documentation"
            [build]="Build"
            [ci]="CI"
            [test]="Tests"
            [style]="Style"
            [chore]="Chores"
          )
          ORDER=(feat fix perf refactor docs build ci test style chore)
          declare -A SECTIONS
          OTHER=""

          while IFS='|' read -r hash subject || [ -n "$hash" ]; do
            type=$(echo "$subject" | grep -oE '^[a-z]+' || true)
            if [ -n "$type" ] && [ -n "${TITLES[$type]:-}" ] && echo "$subject" | grep -qE "^${type}(\(.+\))?!?: "; then
              SECTIONS[$type]+="- ${subject} (${hash})"$'\n'
            else
              OTHER+="- ${subject} (${hash})"$'\n'
            fi
          done < <(git log "$RANGE" --pretty=format:'%h|%s')

          {
            for type in "${ORDER[@]}"; do
              if [ -n "${SECTIONS[$type]:-}" ]; then
                echo "## ${TITLES[$type]}"
                echo
                printf '%s' "${SECTIONS[$type]}"
                echo
              fi
            done
            if [ -n "$OTHER" ]; then
              echo "## Other"
              echo
              printf '%s' "$OTHER"
              echo
            fi
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md
